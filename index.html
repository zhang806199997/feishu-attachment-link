<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的飞书网页应用</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      padding: 20px;
      background: #f5f7fa;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #1f2937;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #0066cc;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>飞书网页应用加载成功</h1>
    <p>这是一个可直接部署到飞书开放平台的极简网页应用模板。</p>
    <p>你可以在这里添加自己的页面、表单、接口调用等内容。</p>
    <button class="btn" onclick="showInfo()">点我测试</button>
  </div>

  <script>
    function showInfo() {
      alert('飞书网页应用运行正常～')
    }
  </script>
</body>
</html>
