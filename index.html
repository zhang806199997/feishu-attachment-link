<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书多维表图片转链接工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-sm p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
      <i class="fa-solid fa-link text-blue-600"></i>
      飞书多维表图片转链接工具
    </h1>

    <!-- 配置区域 -->
    <div class="space-y-4 mb-8">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">App Token / Base ID</label>
        <input id="appToken" type="text" placeholder="bascnXXXXXX" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Table ID</label>
        <input id="tableId" type="text" placeholder="tblXXXXXX" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button id="confirmConfig" class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 rounded-md hover:bg-blue-100 transition">
        <i class="fa-solid fa-check-circle"></i>
        确认配置
      </button>
    </div>

    <!-- 字段映射 -->
    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1">
          <i class="fa-solid fa-image text-gray-500"></i>
          图片附件字段 <span class="text-red-500">*</span>
        </label>
        <select id="imageField" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="图片">图片</option>
        </select>
        <p class="text-xs text-gray-500 mt-1">如果下拉没有你的字段名，请选择相近的或填写自定义字段名</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1">
          <i class="fa-solid fa-link text-gray-500"></i>
          链接目标字段
        </label>
        <div class="flex gap-2">
          <select id="linkField" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="图片链接">图片链接</option>
          </select>
          <button class="px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50">选择</button>
          <button class="px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50">自定义</button>
        </div>
        <p class="text-xs text-gray-500 mt-1">支持填写表格中任意已存在的字段名（文本/URL/多行文本），多张图自动换行拼接</p>
      </div>
    </div>

    <!-- 链接生成方式 -->
    <div class="mb-8">
      <label class="block text-sm font-medium text-gray-700 mb-3 flex items-center gap-1">
        <i class="fa-solid fa-bolt text-blue-500"></i>
        链接生成方式（全部免费）
      </label>
      <div class="space-y-3">
        <div class="border border-gray-200 rounded-lg p-3 bg-blue-50">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2 text-sm font-medium text-gray-800">
                <i class="fa-solid fa-file-code text-blue-600"></i>
                SDK 附件链接（推荐，免费）
              </div>
              <p class="text-xs text-gray-500 mt-1">通过飞书多维表格 JS SDK 获取临时下载链接</p>
            </div>
            <input type="radio" name="linkType" value="sdk" checked class="w-4 h-4 text-blue-600">
          </div>
        </div>
        <div class="border border-gray-200 rounded-lg p-3">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2 text-sm font-medium text-gray-800">
                <i class="fa-solid fa-download text-gray-600"></i>
                开放平台下载链接（免费）
              </div>
              <p class="text-xs text-gray-500 mt-1">基于 file_token 拼接下载 URL</p>
            </div>
            <input type="radio" name="linkType" value="open" class="w-4 h-4 text-blue-600">
          </div>
        </div>
        <div class="border border-gray-200 rounded-lg p-3">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2 text-sm font-medium text-gray-800">
                <i class="fa-solid fa-key text-gray-600"></i>
                仅 file_token（免费）
              </div>
              <p class="text-xs text-gray-500 mt-1">只输出文件 token，自行拼接下载地址</p>
            </div>
            <input type="radio" name="linkType" value="token" class="w-4 h-4 text-blue-600">
          </div>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-2">转换完成后自动写入目标字段</p>
    </div>

    <!-- 执行按钮 -->
    <button id="startConvert" class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-play"></i>
      开始转换
    </button>

    <!-- 结果区域 -->
    <div class="mt-8 pt-6 border-t border-gray-200">
      <h3 class="text-lg font-medium text-gray-800 mb-3">转换结果</h3>
      <div id="result" class="min-h-[100px] bg-gray-50 rounded-lg p-4 text-sm text-gray-600">
        等待转换...
      </div>
    </div>
  </div>

  <script>
    // 模拟飞书 SDK 调用逻辑
    document.getElementById('startConvert').addEventListener('click', async () => {
      const appToken = document.getElementById('appToken').value;
      const tableId = document.getElementById('tableId').value;
      const imageField = document.getElementById('imageField').value;
      const linkField = document.getElementById('linkField').value;
      const linkType = document.querySelector('input[name="linkType"]:checked').value;
      const resultEl = document.getElementById('result');

      if (!appToken || !tableId) {
        resultEl.innerHTML = '<span class="text-red-500">请先填写 App Token 和 Table ID！</span>';
        return;
      }

      resultEl.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i>正在转换中...';

      try {
        // 模拟 API 调用
        await new Promise(resolve => setTimeout(resolve, 2000));
        resultEl.innerHTML = `
          <div class="text-green-600">
            <i class="fa-solid fa-check-circle mr-2"></i>转换完成！<br>
            已将 <strong>${imageField}</strong> 字段的图片转换为链接并写入 <strong>${linkField}</strong> 字段<br>
            生成方式：${linkType === 'sdk' ? 'SDK 附件链接' : linkType === 'open' ? '开放平台下载链接' : '仅 file_token'}
          </div>
        `;
      } catch (err) {
        resultEl.innerHTML = `<span class="text-red-500">转换失败：${err.message}</span>`;
      }
    });
  </script>
</body>
</html>
