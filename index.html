<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>飞书图片转链接</title>
  <script src="https://lf3-cn-tx.bytecdn.cn/obj/obj-platform-static/feishu-jssdk/2.12.0/jssdk.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f5f7fa;padding:20px}
    .card{background:#fff;border-radius:12px;padding:24px;max-width:480px;margin:0 auto}
    .title{font-size:18px;font-weight:600;margin-bottom:8px}
    .desc{color:#666;margin-bottom:20px}
    .btn{width:100%;padding:14px;background:#0066ff;color:white;border:none;border-radius:10px;font-size:16px;margin-bottom:16px}
    #link{padding:12px;border:1px solid #e5e7eb;border-radius:8px;margin-top:12px;word-break:break-all;display:none}
    .copy{background:#666;margin-top:10px}
    .tip{font-size:12px;color:#999;margin-top:12px}
  </style>
</head>

<body>
  <div class="card">
    <div class="title">飞书图片转公开链接</div>
    <div class="desc">选择图片 → 自动上传 → 生成可分享链接</div>

    <button class="btn" id="upload">选择图片并上传</button>

    <div id="link">
      <div style="font-weight:500;margin-bottom:6px">图片链接：</div>
      <div id="url"></div>
      <button class="btn copy" id="copy">复制链接</button>
    </div>

    <div class="tip">仅在飞书客户端内打开有效</div>
  </div>

  <script>
    const sdk = window.h5sdk;

    // 初始化飞书 JSSDK
    sdk.config({
      jsApiList: [
        'image.chooseImage',
        'image.uploadImage'
      ]
    });

    // 选择图片 → 上传 → 拿链接
    document.getElementById('upload').onclick = async () => {
      try {
        // 1. 选图
        const { tempFilePaths } = await sdk.image.chooseImage({
          count: 1,
          sourceType: ['album', 'camera']
        });

        const path = tempFilePaths[0];

        // 2. 上传到飞书素材
        const { fileId } = await sdk.image.uploadImage({
          localId: path
        });

        // 3. 拼接公开链接
        const link = `https://p3-feishu-img.byteimg.com/obj/obj-open-platform-file/${fileId}`;

        // 显示
        document.getElementById('link').style.display = 'block';
        document.getElementById('url').innerText = link;

      } catch (e) {
        alert('失败：' + (e.message || '请在飞书内打开'));
        console.error(e);
      }
    };

    // 复制
    document.getElementById('copy').onclick = async () => {
      const url = document.getElementById('url').innerText;
      await navigator.clipboard.writeText(url);
      alert('已复制');
    };
  </script>
</body>
</html>
