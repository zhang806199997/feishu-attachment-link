<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>飞书图片转公开链接</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f5f7fa;padding:20px}
    .card{background:#fff;border-radius:12px;padding:24px;max-width:480px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
    .title{font-size:18px;font-weight:600;margin-bottom:8px}
    .desc{color:#666;margin-bottom:20px}
    .btn{width:100%;padding:14px;background:#0066ff;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-bottom:16px}
    .btn:disabled{background:#ccc;cursor:not-allowed}
    .status{margin-top:10px;padding:8px;border-radius:4px;font-size:14px}
    .status.success{background:#e8f5e9;color:#2e7d32}
    .status.error{background:#ffebee;color:#c62828}
    .tip{font-size:12px;color:#999;margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="title">飞书图片转公开链接</div>
    <div class="desc">选择图片 → 自动上传 → 生成可分享链接</div>
    <button class="btn" id="upload" disabled>选择图片并上传</button>
    <div id="status" class="status">⌛ 等待飞书客户端注入 SDK...</div>
    <div class="tip">仅在飞书客户端内打开有效</div>
  </div>

  <script>
    const uploadBtn = document.getElementById('upload');
    const statusEl = document.getElementById('status');
    let sdk = null;

    // 轮询等待飞书自动注入 h5sdk
    function waitForH5SDK() {
      if (window.h5sdk) {
        sdk = window.h5sdk;
        initH5SDK();
      } else {
        setTimeout(waitForH5SDK, 300);
        statusEl.textContent = '⌛ 等待飞书客户端注入 SDK...';
      }
    }

    function initH5SDK() {
      sdk.ready(() => {
        statusEl.textContent = '✅ SDK 就绪，点击按钮选择图片';
        statusEl.className = 'status success';
        uploadBtn.disabled = false;
      });

      sdk.error((err) => {
        statusEl.textContent = `❌ SDK 错误：${err.message || '权限不足或环境异常'}`;
        statusEl.className = 'status error';
        uploadBtn.disabled = true;
        console.error('SDK Error:', err);
      });
    }

    // 开始等待 SDK
    waitForH5SDK();

    // 点击上传逻辑
    uploadBtn.onclick = async () => {
      if (!sdk) return;
      uploadBtn.disabled = true;
      statusEl.textContent = '⌛ 正在打开图片选择器...';
      
      try {
        // 选择图片
        const pickRes = await sdk.biz.image.pickImage({
          count: 1,
          source: ['album']
        });
        if (!pickRes?.images?.length) throw new Error('未选择图片');

        statusEl.textContent = '⌛ 正在上传图片...';
        // 上传图片
        const image = pickRes.images[0];
        const uploadRes = await sdk.biz.image.uploadImage({
          file: {
            uri: image.uri,
            name: image.name || 'image.jpg',
            type: image.mime || 'image/jpeg'
          }
        });

        if (!uploadRes?.url) throw new Error('上传失败，未获取到公开链接');
        statusEl.textContent = `✅ 上传成功！链接：${uploadRes.url}`;
        statusEl.className = 'status success';
      } catch (e) {
        statusEl.textContent = `❌ 操作失败：${e.message}`;
        statusEl.className = 'status error';
        console.error('Upload Error:', e);
      } finally {
        uploadBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
