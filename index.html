<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>飞书多维表格图片转链接</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f5f7fa;padding:20px}
    .card{background:#fff;border-radius:12px;padding:24px;max-width:480px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
    .title{font-size:18px;font-weight:600;margin-bottom:8px}
    .desc{color:#666;margin-bottom:20px}
    .btn{width:100%;padding:14px;background:#0066ff;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-bottom:16px}
    .btn:disabled{background:#ccc;cursor:not-allowed}
    .status{margin-top:10px;padding:8px;border-radius:4px;font-size:14px}
    .status.success{background:#e8f5e9;color:#2e7d32}
    .status.error{background:#ffebee;color:#c62828}
    .tip{font-size:12px;color:#999;margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="title">飞书多维表格图片转链接</div>
    <div class="desc">选择图片 → 自动上传 → 生成可分享链接</div>
    <button class="btn" id="upload">选择图片并上传</button>
    <div id="status" class="status">正在初始化多维表格环境...</div>
    <div class="tip">仅在飞书客户端多维表格内打开有效</div>
  </div>

  <!-- 多维表格插件专用 SDK -->
  <script src="https://lf3-cn-tx.bytecdn.cn/obj/obj-platform-static/block-sdk/block-sdk.js"></script>
  <script>
    const uploadBtn = document.getElementById('upload');
    const statusEl = document.getElementById('status');
    let blockInstance = null;

    // 等待多维表格 SDK 初始化
    window.onload = async () => {
      try {
        // 初始化多维表格插件实例
        blockInstance = await window.block.init({
          // 多维表格会自动注入这些环境变量
          context: window.__BLOCK_CONTEXT__
        });

        statusEl.textContent = '✅ 多维表格环境就绪，点击按钮选择图片';
        statusEl.className = 'status success';
        uploadBtn.disabled = false;
      } catch (e) {
        statusEl.textContent = `❌ 环境初始化失败：${e.message || '未知错误'}`;
        statusEl.className = 'status error';
        uploadBtn.disabled = true;
        console.error('Block Init Error:', e);
      }
    };

    // 点击上传逻辑
    uploadBtn.onclick = async () => {
      if (!blockInstance) return;
      uploadBtn.disabled = true;
      statusEl.textContent = '⌛ 正在打开图片选择器...';
      
      try {
        // 1. 调用多维表格选择图片接口
        const pickRes = await blockInstance.call('image.pick', {
          count: 1,
          source: ['album']
        });

        if (!pickRes || pickRes.length === 0) throw new Error('未选择图片');
        statusEl.textContent = '⌛ 正在上传图片...';

        // 2. 上传图片获取公开链接
        const image = pickRes[0];
        const uploadRes = await blockInstance.call('image.upload', {
          file: image
        });

        if (!uploadRes || !uploadRes.url) throw new Error('上传失败，未获取到链接');
        statusEl.textContent = `✅ 上传成功！链接：${uploadRes.url}`;
        statusEl.className = 'status success';

        // 3. 自动写入当前行的「白底图转链接」字段
        await blockInstance.call('record.update', {
          recordId: window.__BLOCK_CONTEXT__.recordId,
          fields: {
            "白底图转链接": uploadRes.url
          }
        });
        statusEl.textContent = '✅ 链接已自动写入表格！';

      } catch (e) {
        statusEl.textContent = `❌ 操作失败：${e.message}`;
        statusEl.className = 'status error';
        console.error('Upload Error:', e);
      } finally {
        uploadBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
