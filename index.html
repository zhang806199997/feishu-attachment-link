<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>附件转公开链接</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      padding: 16px;
      background: #f5f5f5;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h3 {
      margin-bottom: 16px;
      color: #333;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      color: #666;
    }
    select, button {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background: #0066ff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .log {
      margin-top: 16px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .log p {
      margin: 4px 0;
    }
    .log .error {
      color: #d93025;
    }
    .log .info {
      color: #1a73e8;
    }
    .log .success {
      color: #34a853;
    }
    .env-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .env-feishu {
      background: #e8f0fe;
      color: #1a73e8;
    }
    .env-browser {
      background: #f1f3f4;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>附件转公开链接</h3>
    <div id="envBadge" class="env-badge env-browser">🔍 检测环境中...</div>

    <div class="form-group">
      <label for="attachCol">附件所在列</label>
      <select id="attachCol" disabled>
        <option>加载中...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="linkCol">链接输出列</label>
      <select id="linkCol" disabled>
        <option>加载中...</option>
      </select>
    </div>

    <button id="convertBtn" disabled>开始转换</button>
    <button id="reinitBtn" style="background: #f1f3f4; color: #333; margin-top: 8px;">重新初始化</button>

    <div class="log" id="log"></div>
  </div>

  <script>
    let isFeishuEnv = false;
    let bitable = null;
    let tableId = '';
    let viewId = '';

    // 模拟数据（浏览器调试用）
    const mockColumns = [
      { name: '模特图', fieldId: 'model_img' },
      { name: '参考图', fieldId: 'ref_img' },
      { name: '链接输出', fieldId: 'link_out' }
    ];
    const mockRecords = [
      { recordId: 'rec_1', fields: { model_img: [{ url: 'https://example.com/model1.jpg' }], ref_img: [{ url: 'https://example.com/ref1.jpg' }] } },
      { recordId: 'rec_2', fields: { model_img: [{ url: 'https://example.com/model2.jpg' }], ref_img: [] } }
    ];

    const logEl = document.getElementById('log');
    const envBadgeEl = document.getElementById('envBadge');
    const attachSelect = document.getElementById('attachCol');
    const linkSelect = document.getElementById('linkCol');
    const convertBtn = document.getElementById('convertBtn');
    const reinitBtn = document.getElementById('reinitBtn');

    function appendLog(msg, isError = false) {
      const p = document.createElement('p');
      p.className = isError ? 'error' : 'info';
      p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(p);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function getBitable() {
      if (window.larkBase) return window.larkBase;
      if (window.bitable) return window.bitable;
      if (window.feishu?.bitable) return window.feishu.bitable;
      if (window.lark?.bitable) return window.lark.bitable;
      return null;
    }

    async function init(manual = false) {
      if (manual) appendLog('🔄 手动重新初始化...');
      else appendLog('🚀 开始初始化飞书多维表格环境...');

      attachSelect.disabled = true;
      linkSelect.disabled = true;
      convertBtn.disabled = true;
      attachSelect.innerHTML = '<option>加载中...</option>';
      linkSelect.innerHTML = '<option>加载中...</option>';

      try {
        bitable = getBitable();

        if (bitable) {
          isFeishuEnv = true;
          envBadgeEl.className = 'env-badge env-feishu';
          envBadgeEl.textContent = '✅ 飞书多维表格环境';
          appendLog('✅ 检测到飞书多维表格环境');

          if (typeof bitable.ready === 'function') {
            await bitable.ready();
          }

          let context = null;
          if (typeof bitable.getAppContext === 'function') {
            context = await bitable.getAppContext();
            tableId = context.tableId;
            viewId = context.viewId;
            appendLog(`✅ 当前表格ID: ${tableId}, 视图ID: ${viewId}`);
          } else {
            appendLog('⚠️ 未获取到上下文，将使用当前视图');
          }

          let tableMeta = null;
          if (typeof bitable.getTableMeta === 'function') {
            tableMeta = await bitable.getTableMeta({ tableId });
          } else if (bitable.env?.getTableMeta) {
            tableMeta = await bitable.env.getTableMeta({ tableId });
          } else if (bitable.bridge?.getTableMeta) {
            tableMeta = await bitable.bridge.getTableMeta({ tableId });
          } else {
            throw new Error('无法获取表格字段');
          }

          const columns = tableMeta.fields || [];
          appendLog(`✅ 成功获取 ${columns.length} 个字段`);

          attachSelect.innerHTML = '<option value="">请选择附件列</option>';
          linkSelect.innerHTML = '<option value="">请选择输出列</option>';
          columns.forEach(col => {
            const name = col.name || col.title || '未命名';
            const id = col.fieldId || col.id;
            attachSelect.innerHTML += `<option value="${id}">${name}</option>`;
            linkSelect.innerHTML += `<option value="${id}">${name}</option>`;
          });
        } else {
          isFeishuEnv = false;
          envBadgeEl.className = 'env-badge env-browser';
          envBadgeEl.textContent = '🔍 浏览器模拟模式';
          appendLog('ℹ️ 未检测到飞书环境，进入模拟模式');

          attachSelect.innerHTML = '<option value="">请选择附件列</option>';
          linkSelect.innerHTML = '<option value="">请选择输出列</option>';
          mockColumns.forEach(col => {
            attachSelect.innerHTML += `<option value="${col.fieldId}">${col.name}</option>`;
            linkSelect.innerHTML += `<option value="${col.fieldId}">${col.name}</option>`;
          });
          appendLog('✅ 模拟字段加载完成');
        }

        attachSelect.disabled = false;
        linkSelect.disabled = false;
        convertBtn.disabled = false;
        appendLog('✅ 初始化完成，可选择列并开始转换');
      } catch (err) {
        appendLog(`❌ 初始化失败: ${err.message}`, true);
        console.error(err);
        isFeishuEnv = false;
        envBadgeEl.className = 'env-badge env-browser';
        envBadgeEl.textContent = '🔍 浏览器模拟模式';
        appendLog('⚠️ 已自动切换到模拟模式');
      }
    }

    convertBtn.addEventListener('click', async () => {
      const attachColId = attachSelect.value;
      const linkColId = linkSelect.value;

      if (!attachColId || !linkColId) {
        appendLog('⚠️ 请先选择【附件所在列】和【链接输出列】', true);
        return;
      }

      appendLog(`🚀 开始转换：附件列=${attachColId}，输出列=${linkColId}`);
      convertBtn.disabled = true;

      try {
        let records;
        if (isFeishuEnv) {
          if (typeof bitable.getRecords === 'function') {
            records = await bitable.getRecords({ tableId, viewId, fieldIds: [attachColId] });
          } else if (bitable.bridge?.getRecords) {
            records = await bitable.bridge.getRecords({ tableId, viewId, fieldIds: [attachColId] });
          } else {
            throw new Error('无法获取记录');
          }
          appendLog(`✅ 获取到 ${records.length} 条记录`);
        } else {
          records = mockRecords;
          appendLog(`ℹ️ 模拟模式：使用 ${records.length} 条测试数据`);
        }

        for (let i = 0; i < records.length; i++) {
          const record = records[i];
          const recordId = record.recordId;
          const attachValue = record.fields[attachColId];

          if (!attachValue || attachValue.length === 0) {
            appendLog(`ℹ️ 记录 ${i+1}：无附件，跳过`);
            continue;
          }

          // 把所有附件URL用换行拼接
          const urls = attachValue.map(file => file.url).join('\n');
          appendLog(`ℹ️ 记录 ${i+1}：提取到 ${attachValue.length} 个链接`);

          if (isFeishuEnv) {
            if (typeof bitable.setRecordValue === 'function') {
              await bitable.setRecordValue({ tableId, recordId, fieldId: linkColId, value: urls });
            } else if (bitable.bridge?.setRecordValue) {
              await bitable.bridge.setRecordValue({ tableId, recordId, fieldId: linkColId, value: urls });
            } else {
              throw new Error('无法写入链接');
            }
            appendLog(`✅ 记录 ${i+1}：链接已写入表格`);
          } else {
            appendLog(`✅ 记录 ${i+1}：模拟写入链接 → ${urls}`);
          }
        }

        appendLog('🎉 全部转换完成！');
      } catch (err) {
        appendLog(`❌ 转换失败: ${err.message}`, true);
        console.error(err);
      } finally {
        convertBtn.disabled = false;
      }
    });

    reinitBtn.addEventListener('click', () => init(true));

    // 页面加载完成后自动初始化
    window.addEventListener('load', () => init());
  </script>
</body>
</html>
